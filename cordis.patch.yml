# dsh-orchestrator bundle patch: one row mounts the host half. The same package
# name is what the client-modules scan matches to serve the browser half at
# /plugins/dsh-orchestrator/client.js, so no second row is needed.
#
# Override the config in your own profile patch with a row of the same id.
- insert:
    - id: taskboard
      name: dsh-orchestrator
